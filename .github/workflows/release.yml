name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          set +e
          swift test 2> /tmp/test-errors.txt
          code=$?
          if [ $code -ne 0 ]; then
            echo "# ❌ swift test 失败(退出码 $code)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error|warning" -A2 /tmp/test-errors.txt | head -80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build universal binaries
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product FanBar
          swift build -c release --arch arm64 --arch x86_64 --product fanctl

      - name: Package DMG
        run: ./package-dist.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
