name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          set +e
          swift test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            cp /tmp/test.log ci-error.txt
            git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
            git add ci-error.txt
            git commit -m "ci log" --no-verify
            git push origin HEAD:ci-debug
            exit 1
          fi

      - name: Build universal binaries
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product FanBar
          swift build -c release --arch arm64 --arch x86_64 --product fanctl

      - name: Package DMG
        run: ./package-dist.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
