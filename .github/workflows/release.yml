name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binaries
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product FanBar
          swift build -c release --arch arm64 --arch x86_64 --product fanctl

      - name: Package DMG
        run: |
          sed -i '' 's|cp build-resources/AppIcon.icns|cp build-resources/AppIcon.icns|' package-dist.sh
          ./package-dist.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
