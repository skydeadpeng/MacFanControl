name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Run unit tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          swift test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:" /tmp/test.log | sort -u | head -25 | while IFS= read -r line; do
              echo "::error::${line:0:250}"
            done
            tail -40 /tmp/test.log | while IFS= read -r line; do
              echo "::error::[tail] ${line:0:200}"
            done
            tail -200 /tmp/test.log > "ci-error-$GITHUB_RUN_ID.txt" || true
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci-error-$GITHUB_RUN_ID.txt" \
              -f message="ci error log $GITHUB_RUN_ID" \
              -f content="$(base64 -i "ci-error-$GITHUB_RUN_ID.txt")" > /dev/null || true
            exit 1
          fi

      - name: Build universal binaries
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product FanBar
          swift build -c release --arch arm64 --arch x86_64 --product fanctl

      - name: Package DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./package-dist.sh > /tmp/pkg.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== 环境诊断 ===" >> /tmp/pkg.log
            {
              sw_vers
              xcodebuild -version
              swift build --version
              echo "--- 内存 ---"; vm_stat | head -8; sysctl hw.memsize
              echo "--- 磁盘 ---"; df -h / | tail -2
              echo "--- 日志末尾 80 行 ---"
              tail -80 /tmp/pkg.log
            } >> /tmp/pkg.log 2>&1
            tail -30 /tmp/pkg.log | while IFS= read -r line; do
              echo "::error::[pkg] ${line:0:200}"
            done
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci-pkg-$GITHUB_RUN_ID.log" \
              -f message="ci pkg log $GITHUB_RUN_ID" \
              -f content="$(base64 -i /tmp/pkg.log)" > /dev/null || true
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

# 注:v3.1.0 首次构建 runner 在 swift build 计划阶段无输出即挂(疑似 runner 资源问题),重触发验证
